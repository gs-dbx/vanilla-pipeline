name: arch-guard

on:
  # Runs automatically on every pull request touching pipeline code
  pull_request:
    paths:
      - "pipelines/**"
      - "databricks.yml"
      - "arch-contract.yaml"

  # Also runnable manually from the GitHub Actions tab (Actions → arch-guard → Run workflow)
  # Useful for testing without opening a PR.
  workflow_dispatch:
    inputs:
      advisory:
        description: "Run in advisory mode (non-blocking)"
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  id-token: write

jobs:
  arch-guard:
    uses: gs-dbx/arch-guard/.github/workflows/arch-guard-callable.yml@main
    with:
      contract: arch-contract.yaml
      advisory: ${{ github.event_name == 'workflow_dispatch' && inputs.advisory || true }}
      runner: self-hosted
      databricks_host: ${{ vars.DATABRICKS_HOST }}
      databricks_client_id: ${{ vars.DATABRICKS_CLIENT_ID }}
      databricks_auth_type: client-credentials
      fm_endpoint: ${{ vars.FM_SERVING_ENDPOINT }}
    secrets:
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
