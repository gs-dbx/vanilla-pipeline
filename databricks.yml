bundle:
  name: vanilla-pipeline

targets:
  dev:
    mode: development
    workspace:
      host: ${var.databricks_host}
  test:
    workspace:
      host: ${var.databricks_host}
  preprod:
    workspace:
      host: ${var.databricks_host}
  prod:
    workspace:
      host: ${var.databricks_host}

resources:
  pipelines:
    plp_bronze_events_ingest:
      name: plp_bronze_events_ingest
      catalog: csb_dev_events_stage
      target: events
      libraries:
        - notebook: {path: ./pipelines/ingest.py}
    plp_silver_events_transform:
      name: plp_silver_events_transform
      catalog: csb_dev_events_cleansed
      target: events
      libraries:
        - notebook: {path: ./pipelines/transform.py}
    plp_gold_events_serve:
      name: plp_gold_events_serve
      catalog: csb_dev_analytics
      target: events
      libraries:
        - notebook: {path: ./pipelines/serve.py}
