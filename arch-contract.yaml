version: 1

sanctioned_catalogs:
  - {name: csb_dev_events_stage, env: dev}
  - {name: csb_dev_events_cleansed, env: dev}
  - {name: csb_dev_analytics, env: dev}
  - {name: csb_dev_apps, env: dev}

catalog_convention:
  prefix: csb
  environments: [dev, test, preprod, prod]
  domain_layers:
    bronze_suffix: stage
    silver_suffix: cleansed
  gold_catalogs: [analytics, apps]

datasets:
  severity: warning
  required_tags: [dataset_name]
  allowed:
    - {name: events, domain: events}

external_sources:
  - {name: kafka_events, type: kafka}
  - {name: s3_landing_zone, type: cloud_storage}

schemas:
  required: [events]
  tier_map: {events: bronze}

tiering:
  bronze: {may_read_from: [external], may_write_to: [bronze]}
  silver: {may_read_from: [bronze], may_write_to: [silver]}
  gold: {may_read_from: [silver], may_write_to: [gold], serving: true}

naming:
  tables: {pattern: "^[a-z][a-z0-9_]+$", severity: error}
  pipelines: {pattern: "^plp_(bronze|silver|gold)_[a-z0-9_]+$", severity: error}
  jobs: {pattern: "^job_[a-z0-9_]+$", severity: warning}
  bronze_table_prefix: {pattern: "^raw_", severity: warning}

required_tags:
  tables: [owner, cost_center]
  pipelines: [owner]

overrides:
  mechanism: pr_label
  label: arch-override-approved
  authorized_teams: [data-platform-admins]
  require_reason: true
